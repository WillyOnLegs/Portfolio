<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Page not found | WillyOL</title>
<link rel="icon" type="image/svg+xml" href="/medias/1.assets/icon.svg">
<link rel="apple-touch-icon" href="/medias/1.assets/apple-touch-icon.png">
<link rel="preload" href="/medias/fonts/anton-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<meta name="theme-color" content="#0a0a0a">
<style>
@font-face{font-family:'Anton';font-display:swap;src:url(/medias/fonts/anton-latin-400-normal.woff2) format('woff2')}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:#0a0a0a;color:#fff;font-family:Arial,sans-serif;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;min-height:100svh;overflow:hidden}
a{color:inherit;text-decoration:none}
header{display:flex;justify-content:space-between;align-items:center;padding:clamp(1rem,2.5vw,1.8rem) clamp(1.2rem,3vw,2.5rem)}
.logo{display:block;height:clamp(2.19rem,3.75vw,3rem);width:calc(clamp(2.19rem,3.75vw,3rem)*3.13);background:#fff;-webkit-mask:url(/medias/1.assets/logo.svg) left center/auto 100% no-repeat;mask:url(/medias/1.assets/logo.svg) left center/auto 100% no-repeat}
main{flex:1;display:flex;flex-direction:column;justify-content:center;padding:0 clamp(1.2rem,9.5vw,10rem) 6vh}
.num{font-family:'Anton',sans-serif;font-weight:400;font-size:clamp(9rem,34vw,32rem);line-height:.82;letter-spacing:-.01em;display:flex;overflow:hidden}
.num span{display:inline-block;transform:translateY(105%);animation:up 1s cubic-bezier(.16,1,.3,1) forwards}
.num span:nth-child(2){animation-delay:.08s}.num span:nth-child(3){animation-delay:.16s}
.bas{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:2rem;margin-top:clamp(1.5rem,3vw,2.5rem);opacity:0;animation:fade .8s ease .55s forwards}
.txt{font-size:clamp(1rem,1.4vw,1.25rem);line-height:1.45;max-width:30rem;color:rgba(255,255,255,.85)}
.liens{display:flex;gap:.75rem;flex-wrap:wrap}
.btn{font-family:'Anton',sans-serif;text-transform:uppercase;font-size:clamp(1rem,1.3vw,1.15rem);letter-spacing:.04em;padding:.85em 1.4em;border-radius:999px;border:1px solid #fff;transition:background .3s ease,color .3s ease}
.btn--plein{background:#fff;color:#0a0a0a}
.btn:hover{background:#fff;color:#0a0a0a}
.btn--plein:hover{background:transparent;color:#fff}
@keyframes up{to{transform:none}}
@keyframes fade{to{opacity:1}}
@media (prefers-reduced-motion:reduce){.num span,.bas{animation:none;transform:none;opacity:1}}
</style>
</head>
<body>
<header><a class="logo" href="/" aria-label="WillyOL"></a></header>
<main>
  <h1 class="num" aria-label="404"><span>4</span><span>0</span><span>4</span></h1>
  <div class="bas">
    <p class="txt" data-fr="Cette page n'existe pas, ou plus. Le lien est peut-être cassé, ou le projet a changé d'adresse.">This page doesn't exist, or not anymore. The link may be broken, or the project has moved.</p>
    <div class="liens">
      <a class="btn btn--plein" href="/" data-fr="Retour à l'accueil">Back home</a>
      <a class="btn" href="/work" data-fr="Voir les projets">See the work</a>
    </div>
  </div>
</main>
<script>
(function(){
  var l='en';
  try{l=localStorage.getItem('langue')||((navigator.language||'').slice(0,2)==='fr'?'fr':'en');}catch(e){}
  if(l!=='fr')return;
  document.documentElement.lang='fr';
  document.title='Page introuvable | WillyOL';
  document.querySelectorAll('[data-fr]').forEach(function(el){el.textContent=el.getAttribute('data-fr');});
})();
</script>
<script src="/js/stats.js?v=52" defer></script></body>
</html>
